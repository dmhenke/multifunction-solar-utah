<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="xsWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f0"/>
      <stop offset="1" stop-color="#9fc3dd"/>
    </linearGradient>
    <linearGradient id="xsShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5675" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f5675" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="xsBed" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#cbb994"/>
      <circle cx="3" cy="3" r="1.1" fill="#a08c63"/>
      <circle cx="8" cy="7" r="1.1" fill="#a08c63"/>
    </pattern>
    <marker id="xsArr" markerWidth="10" markerHeight="10" refX="8" refY="3.4" orient="auto">
      <path d="M0,0 L8,3.4 L0,6.8 Z" fill="#3d4b57"/>
    </marker>
    <marker id="xsArrW" markerWidth="10" markerHeight="10" refX="8" refY="3.4" orient="auto">
      <path d="M0,0 L8,3.4 L0,6.8 Z" fill="#2b7a4b"/>
    </marker>
    <marker id="xsDim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,4 L8,4 M4,0 L4,8" stroke="#8f2f2f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1160" height="820" fill="#ffffff"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="44" font-size="23" font-weight="700" fill="#12283d">Elevated Over-Water PV — Typical Cross-Section</text>
  <text x="40" y="68" font-size="13.5" fill="#4a5b6b">Modules on fixed racks several feet above the highest design water level, carried on piles fixed in the bed. Nothing rests on the water.</text>
  <text x="40" y="88" font-size="12" font-weight="600" fill="#9a4b2f">SCHEMATIC — NOT TO SCALE. Heights, spans and embedment are illustrative; set by hydrology, ice and geotechnical design.</text>
  <line x1="40" y1="102" x2="1120" y2="102" stroke="#12283d" stroke-width="1.6"/>

  <!-- ===== SKY / SUN ===== -->
  <circle cx="110" cy="160" r="26" fill="#f6c445"/>
  <g stroke="#f0b429" stroke-width="2">
    <line x1="150" y1="175" x2="260" y2="215"/><line x1="145" y1="190" x2="230" y2="250"/><line x1="138" y1="200" x2="200" y2="280"/>
  </g>

  <!-- ===== WATER BODY ===== -->
  <path d="M40,380 L980,380 L1040,330 L1120,300 L1120,640 L40,640 Z" fill="#cfe3f0"/>
  <!-- bed / sediment -->
  <path d="M40,560 C200,552 360,566 520,556 C680,546 820,560 930,548 C990,540 1040,460 1120,380 L1120,700 L40,700 Z" fill="url(#xsBed)" stroke="#8a7650" stroke-width="1.6"/>
  <text x="70" y="620" font-size="12" font-weight="700" fill="#5e4d2e">RESERVOIR / LAKE BED (sediment)</text>

  <!-- shore bank -->
  <path d="M930,548 C990,540 1040,460 1120,380 L1120,300 C1080,300 1050,312 1040,330 L980,380 Z" fill="#d9cfb4" opacity="0.0"/>
  <path d="M1000,700 L1000,470 C1030,430 1060,330 1120,250 L1120,700 Z" fill="#d6cba9" stroke="#8a7650" stroke-width="1.4"/>
  <text x="1030" y="560" font-size="11" fill="#5e4d2e" transform="rotate(-62 1030 560)">SHORE</text>

  <!-- shade beneath array -->
  <rect x="232" y="387" width="676" height="171" fill="#b5ccdc"/>
  <text x="570" y="548" font-size="10" fill="#2f5675" text-anchor="middle">shade beneath the array — light reduced ≈60%</text>

  <!-- ===== WATER LEVELS ===== -->
  <line x1="40" y1="300" x2="1040" y2="300" stroke="#8f2f2f" stroke-width="1.8" stroke-dasharray="10 6"/>
  <text x="46" y="293" font-size="11" font-weight="700" fill="#8f2f2f">MAXIMUM DESIGN WATER SURFACE</text>
  <text x="46" y="316" font-size="10" fill="#8f2f2f">flood pool + surcharge + run-up + ice</text>
  <line x1="40" y1="380" x2="985" y2="380" stroke="#2f6a95" stroke-width="2.4"/>
  <text x="46" y="372" font-size="11" font-weight="700" fill="#2f6a95">NORMAL FULL POOL</text>
  <line x1="40" y1="470" x2="1010" y2="470" stroke="#2f6a95" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="46" y="463" font-size="10.5" fill="#2f6a95">minimum pool — array does not move</text>

  <!-- ===== ICE at full pool ===== -->
  <rect x="40" y="380" width="945" height="7" fill="#eef6fb" stroke="#9cc1da" stroke-width="0.8"/>

  <!-- ===== PILES ===== -->
  <g fill="#9aa3ab" stroke="#4f5a63" stroke-width="1.4">
    <rect x="262" y="246" width="16" height="354"/>
    <rect x="422" y="246" width="16" height="350"/>
    <rect x="582" y="246" width="16" height="352"/>
    <rect x="742" y="246" width="16" height="346"/>
    <rect x="874" y="246" width="16" height="336"/>
  </g>
  <!-- ice collars -->
  <g fill="#ffffff" stroke="#6c99bb" stroke-width="1.4">
    <rect x="258" y="374" width="24" height="18" rx="3"/><rect x="418" y="374" width="24" height="18" rx="3"/>
    <rect x="578" y="374" width="24" height="18" rx="3"/><rect x="738" y="374" width="24" height="18" rx="3"/>
    <rect x="870" y="374" width="24" height="18" rx="3"/>
  </g>

  <!-- ===== RACK + WALKWAY ===== -->
  <rect x="236" y="234" width="670" height="12" fill="#7d8790" stroke="#4f5a63" stroke-width="1.4"/>
  <g stroke="#4f5a63" stroke-width="1.2">
    <line x1="270" y1="246" x2="350" y2="234"/><line x1="350" y1="234" x2="430" y2="246"/>
    <line x1="430" y1="246" x2="510" y2="234"/><line x1="510" y1="234" x2="590" y2="246"/>
    <line x1="590" y1="246" x2="670" y2="234"/><line x1="670" y1="234" x2="750" y2="246"/>
    <line x1="750" y1="246" x2="820" y2="234"/><line x1="820" y1="234" x2="882" y2="246"/>
  </g>

  <!-- ===== MODULES (tilted rows with gaps) ===== -->
  <g fill="#1f4e79" stroke="#0d2c48" stroke-width="1.4">
    <path d="M250,232 L330,232 L330,196 Z"/>
    <path d="M352,232 L432,232 L432,196 Z"/>
    <path d="M454,232 L534,232 L534,196 Z"/>
    <path d="M556,232 L636,232 L636,196 Z"/>
    <path d="M658,232 L738,232 L738,196 Z"/>
    <path d="M760,232 L840,232 L840,196 Z"/>
  </g>
  <text x="570" y="184" font-size="12" font-weight="700" fill="#0d2c48" text-anchor="middle">GLASS–GLASS MODULES · 10–15° FIXED TILT · ROW GAPS ADMIT LIGHT</text>

  <!-- ===== CLEARANCE DIMENSION ===== -->
  <line x1="950" y1="246" x2="950" y2="300" stroke="#8f2f2f" stroke-width="1.6" marker-start="url(#xsDim)" marker-end="url(#xsDim)"/>
  <line x1="906" y1="246" x2="962" y2="246" stroke="#8f2f2f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="962" y="270" font-size="12" font-weight="700" fill="#8f2f2f">≥ 6 ft</text>
  <text x="962" y="285" font-size="10.5" fill="#8f2f2f">clearance to rack underside</text>

  <!-- ===== WIND beneath the canopy ===== -->
  <line x1="120" y1="342" x2="1000" y2="342" stroke="#2b7a4b" stroke-width="2.2" stroke-dasharray="14 8" marker-end="url(#xsArrW)"/>
  <text x="300" y="336" font-size="11" font-weight="700" fill="#2b7a4b">WIND STILL PASSES BENEATH — WATER SURFACE STAYS OPEN TO AIR</text>
  <text x="300" y="358" font-size="10.5" fill="#2b7a4b">reaeration preserved: oxygen penalty about a third of a floating array; less evaporation saved (≈40% vs 44%)</text>

  <!-- ===== EMBEDMENT DIMENSION ===== -->
  <line x1="236" y1="556" x2="236" y2="600" stroke="#5e4d2e" stroke-width="1.4" marker-start="url(#xsDim)" marker-end="url(#xsDim)"/>
  <text x="140" y="584" font-size="10.5" font-weight="700" fill="#5e4d2e">embedment</text>

  <!-- ===== CALLOUTS ===== -->
  <g font-size="10.5" fill="#3d4b57">
    <line x1="430" y1="597" x2="452" y2="630" stroke="#3d4b57" stroke-width="1"/>
    <text x="456" y="636" font-weight="700">PILES</text>
    <text x="456" y="650">precast concrete or stainless/duplex steel; drilled or vibratory</text>
    <text x="456" y="664">installation; no zinc, coal-tar or biocidal coatings below water</text>
    <line x1="257" y1="386" x2="214" y2="400" stroke="#3d4b57" stroke-width="1"/>
    <text x="50" y="405" font-weight="700">ICE</text>
    <text x="50" y="419">sheet-ice thrust and</text>
    <text x="50" y="433">ice-jacking on piles;</text>
    <text x="50" y="447">modules stay clear</text>
  </g>

  <!-- ===== CABLE TO SHORE ===== -->
  <path d="M906,240 L1010,240 C1040,240 1060,236 1075,232" fill="none" stroke="#c2402f" stroke-width="2.6" stroke-dasharray="9 5"/>
  <rect x="1060" y="200" width="56" height="34" rx="3" fill="#e9dfd3" stroke="#7a6a58" stroke-width="1.6"/>
  <text x="1088" y="214" font-size="8.5" font-weight="700" fill="#4d4034" text-anchor="middle">INVERTERS</text>
  <text x="1088" y="226" font-size="8.5" fill="#4d4034" text-anchor="middle">onshore</text>
  <text x="960" y="230" font-size="10" fill="#a2331f">DC cable on walkway</text>

  <!-- ===== SITE NOTES ===== -->
  <rect x="40" y="716" width="530" height="90" rx="6" fill="#fafbfc" stroke="#c6d0d9" stroke-width="1.4"/>
  <text x="56" y="738" font-size="13" font-weight="700" fill="#12283d">Little Dell Reservoir</text>
  <g font-size="11" fill="#25384a">
    <text x="56" y="756">Design water surface = top of flood-control pool, not normal full pool.</text>
    <text x="56" y="772">Piles only where full-pool depth is under ~40 ft (mean 82 ft, max ≈200 ft).</text>
    <text x="56" y="788">Culinary source: only the piles touch the water.</text>
  </g>
  <rect x="590" y="716" width="530" height="90" rx="6" fill="#fafbfc" stroke="#c6d0d9" stroke-width="1.4"/>
  <text x="606" y="738" font-size="13" font-weight="700" fill="#12283d">Great Salt Lake — research module F1</text>
  <g font-size="11" fill="#25384a">
    <text x="606" y="756">Rack underside ≈4,204 ft: above the 4,200 ft limit, ≈12 ft over today's water.</text>
    <text x="606" y="772">Lake has ranged 4,188–≈4,212 ft; removed if stage reaches 4,198 ft.</text>
    <text x="606" y="788">Brine-resistant piles (duplex, FRP or sulfate-resistant concrete).</text>
  </g>
  <text x="40" y="711" font-size="10" fill="#7b8794">Precedent: the 1 GW HG14 array (Shandong, 2025) stands on fixed piles in 1–4 m of water.</text>
</svg>
